<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charity: Water</title>

<style>
body{
    background:#f3efe1;
    font-family:Arial, sans-serif;
    margin:0;
    padding:40px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header img {
    height: 150px;
}

nav a{
    text-decoration:none;
    background:#86b2c7;
    color:white;
    padding:12px 20px;
    border-radius:25px;
    margin-left:10px;
}

.hero{
    display:flex;
    align-items:center;
    gap:50px;
    margin-top:50px;
}

.hero-image img{
    width:700px;
    max-width:100%;
}

.hero-content h1{
    color:#b96f48;
    font-size:3rem;
}

.hero-content p{
    color:#7da7ba;
    font-size:1.5rem;
}

.button{
    display:inline-block;
    background:#ffc907;
    color:#b96f48;
    padding:15px 30px;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}
</style>

</head>
<body>

<header>

<div class="logo">
<img src="img/charity-water-logo.png" alt="Charity Water Logo">
</div>

<nav>
<a href="#">OUR WORK</a>
<a href="#">ABOUT US</a>
<a href="#">CONTACT</a>
</nav>

</header>

<section class="hero">

<div class="hero-image">
<img src="img/child-water.jpg" alt="Child drinking water">
</div>

<div class="hero-content">
<h1>GIVE CLEAN WATER.<br>MAKE REAL IMPACT.</h1>

<p>
Help bring safe water to people in need.<br>
100% of donations fund water projects.
</p>

<a href="#" class="button">START YOUR IMPACT</a>

</div>

</section>

</body>
</html>
